name: Python offline shipping foundation tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check no private shipping files or secrets are tracked
        run: python scripts/check_repo_security.py
      - name: Check Python syntax
        run: python -m compileall -q puro streamlit_app.py tests
      - name: Offline tests (no credentials, no carrier calls)
        run: python -m pytest -q
